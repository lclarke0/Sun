name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk Sunpath.apk

      - name: Report build error
        if: failure()
        run: |
          enc() { sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          what=$( (grep -n -B2 -A30 -E "What went wrong|error:|ERROR:|e: " build.log || true) | head -90 | enc)
          echo "::error title=Gradle error::${what}"
          last=$(tail -60 build.log | enc)
          echo "::warning title=Build log tail::${last}"

      - uses: actions/upload-artifact@v4
        with:
          name: Sunpath-apk
          path: Sunpath.apk

      - name: Publish as a release (download it from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sunpath build ${{ github.run_number }}
          files: Sunpath.apk
