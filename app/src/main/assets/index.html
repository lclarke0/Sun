<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>

<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one narrow instrument column — sky panorama on top, the countdown as the hero reading, almanac facts below */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #131a27;
  --muted: #5a6478;
  --line: #d6dce6;
  --sun: #d97f12;
  --sun-ink: #8f4e00;
  --night: #4a55b8;
  --chip: #e3e8f0;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f18; --surface: #131a26; --ink: #e9edf4; --muted: #8e99ab; --line: #253044;
    --sun: #f5a524; --sun-ink: #f7b955; --night: #8e98ff; --chip: #1b2433; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f18; --surface: #131a26; --ink: #e9edf4; --muted: #8e99ab; --line: #253044;
  --sun: #f5a524; --sun-ink: #f7b955; --night: #8e98ff; --chip: #1b2433; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.place { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.place-name { font-family: var(--f-display); font-size: 28px; line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; }
.place-change { font-size: 13px; color: var(--sun-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.clock { text-align: right; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.clock-time { font-size: 18px; font-weight: 600; }
.clock-date { font-size: 13px; color: var(--muted); }

.sky { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 5 / 4; max-width: 100%; max-height: 58vh; background: #0d1430; }
.sky canvas { display: block; width: 100%; height: 100%; }
.sky-tag {
  position: absolute; left: 12px; top: 12px; padding: 6px 10px; border-radius: 999px;
  background: rgba(8, 12, 24, .45); color: #f3f5fa; font-size: 12.5px; font-family: var(--f-mono);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); max-width: calc(100% - 24px);
}

.readout { display: flex; flex-direction: column; gap: 6px; }
.countdown { font-size: clamp(40px, 13vw, 60px); font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.countdown .u { font-size: .42em; font-weight: 400; color: var(--muted); margin: 0 .35em 0 .06em; letter-spacing: 0; }
.cd-sub { color: var(--muted); font-size: 15px; }
.cd-sub b { color: var(--ink); }
.track { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; margin-top: 8px; }
.fill { height: 100%; width: 0; border-radius: 99px; background: var(--sun); transition: width .6s ease; }
.is-night .fill { background: var(--night); }
.is-night .countdown { color: var(--night); }
.track-ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }

.weather { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.wx-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wx-cond { font-family: var(--f-display); font-size: 20px; }
.wx-temp { font-size: 20px; font-weight: 600; }
.wx-note { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:disabled { opacity: .45; cursor: not-allowed; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line); }
.fact { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fact:nth-child(odd) { padding-right: 12px; }
.fact:nth-child(even) { padding-left: 12px; border-left: 1px solid var(--line); }
.fact dd { margin: 0; font-family: var(--f-mono); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fact dt { font-size: 12.5px; color: var(--muted); }
.foot { font-size: 12.5px; color: var(--muted); }

.backdrop { position: fixed; inset: 0; background: rgba(5, 8, 15, .5); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); color: var(--ink);
  border-radius: 20px 20px 0 0; max-height: 88vh; overflow-y: auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-top: 18px; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
}
.sheet-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--chip); border-radius: 12px; padding: 10px 14px; cursor: pointer; font-weight: 700; }
.btn-primary { background: var(--sun); border-color: var(--sun); color: #1a1205; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
input[type="text"], input[type="number"] {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0;
}
.coords { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.results:empty { display: none; }
.results button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; cursor: pointer; }
.results li:last-child button { border-bottom: 0; }
.results small { color: var(--muted); }
.status { font-size: 13px; color: var(--muted); margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: var(--chip); padding: 8px 16px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

<main class="app" id="app">
  <header class="top">
    <button class="place" id="placeBtn" aria-haspopup="dialog">
      <span class="eyebrow">Sky over</span>
      <span class="place-name" id="placeName">Chicago</span>
      <span class="place-change">Change location</span>
    </button>
    <div class="clock">
      <span class="clock-time mono" id="clockTime">--:--</span>
      <span class="clock-date" id="clockDate"></span>
    </div>
  </header>

  <section class="sky" aria-label="Sky view showing the sun's path and current position">
    <canvas id="sky"></canvas>
    <div class="sky-tag" id="skyTag">Finding the sun…</div>
  </section>

  <section class="readout" id="readout" aria-live="polite">
    <div class="eyebrow" id="cdLabel">Daylight left</div>
    <div class="countdown mono" id="countdown">--</div>
    <div class="cd-sub" id="cdSub"></div>
    <div class="track" aria-hidden="true"><div class="fill" id="trackFill"></div></div>
    <div class="track-ends"><span id="trackStart"></span><span id="trackEnd"></span></div>
  </section>

  <section class="weather" aria-label="Weather">
    <div class="wx-row">
      <span class="wx-cond" id="wxCond">Clear</span>
      <span class="wx-temp mono" id="wxTemp"></span>
    </div>
    <p class="wx-note" id="wxNote" style="margin:0">Loading live weather…</p>
    <div class="chips" id="chips" role="group" aria-label="Sky conditions"></div>
  </section>

  <dl class="facts" id="facts" style="margin:0"></dl>
  <p class="foot" id="foot" style="margin:0"></p>
</main>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-in">
    <div class="sheet-head">
      <h2 id="sheetTitle">Location &amp; units</h2>
      <button class="btn" id="sheetDone">Done</button>
    </div>
    <div class="field">
      <button class="btn btn-primary" id="gpsBtn">Use my location</button>
      <p class="status" id="gpsStatus"></p>
    </div>
    <div class="field">
      <label for="citySearch">Search for a city</label>
      <input type="text" id="citySearch" placeholder="e.g. Denver, Tokyo, Reykjavik" autocomplete="off">
      <ul class="results" id="cityResults"></ul>
    </div>
    <div class="field">
      <label>Or enter coordinates</label>
      <div class="coords">
        <input type="number" id="latIn" step="any" placeholder="Latitude" aria-label="Latitude">
        <input type="number" id="lonIn" step="any" placeholder="Longitude" aria-label="Longitude">
        <button class="btn" id="coordBtn">Set</button>
      </div>
      <p class="status" id="coordStatus"></p>
    </div>
    <div class="field">
      <label>Temperature</label>
      <div class="seg" role="group" aria-label="Temperature units">
        <button id="unitF" aria-pressed="true">°F</button>
        <button id="unitC" aria-pressed="false">°C</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("sunpath:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sunpath:" + k, JSON.stringify(v)); } catch (e) {} }
};
const deviceTZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) { return "UTC"; } })();

const CITIES = [
  ["Chicago","Illinois, US",41.8781,-87.6298,"America/Chicago"],["New York","New York, US",40.7128,-74.006,"America/New_York"],
  ["Los Angeles","California, US",34.0522,-118.2437,"America/Los_Angeles"],["Denver","Colorado, US",39.7392,-104.9903,"America/Denver"],
  ["Phoenix","Arizona, US",33.4484,-112.074,"America/Phoenix"],["Seattle","Washington, US",47.6062,-122.3321,"America/Los_Angeles"],
  ["San Francisco","California, US",37.7749,-122.4194,"America/Los_Angeles"],["Miami","Florida, US",25.7617,-80.1918,"America/New_York"],
  ["Dallas","Texas, US",32.7767,-96.797,"America/Chicago"],["Houston","Texas, US",29.7604,-95.3698,"America/Chicago"],
  ["Austin","Texas, US",30.2672,-97.7431,"America/Chicago"],["Atlanta","Georgia, US",33.749,-84.388,"America/New_York"],
  ["Minneapolis","Minnesota, US",44.9778,-93.265,"America/Chicago"],["St. Louis","Missouri, US",38.627,-90.1994,"America/Chicago"],
  ["Kansas City","Missouri, US",39.0997,-94.5786,"America/Chicago"],["Nashville","Tennessee, US",36.1627,-86.7816,"America/Chicago"],
  ["Milwaukee","Wisconsin, US",43.0389,-87.9065,"America/Chicago"],["New Orleans","Louisiana, US",29.9511,-90.0715,"America/Chicago"],
  ["Boston","Massachusetts, US",42.3601,-71.0589,"America/New_York"],["Washington","D.C., US",38.9072,-77.0369,"America/New_York"],
  ["Detroit","Michigan, US",42.3314,-83.0458,"America/Detroit"],["Anchorage","Alaska, US",61.2181,-149.9003,"America/Anchorage"],
  ["Honolulu","Hawaii, US",21.3069,-157.8583,"Pacific/Honolulu"],["Toronto","Ontario, Canada",43.6532,-79.3832,"America/Toronto"],
  ["Vancouver","British Columbia, Canada",49.2827,-123.1207,"America/Vancouver"],["Mexico City","Mexico",19.4326,-99.1332,"America/Mexico_City"],
  ["London","United Kingdom",51.5074,-0.1278,"Europe/London"],["Paris","France",48.8566,2.3522,"Europe/Paris"],
  ["Berlin","Germany",52.52,13.405,"Europe/Berlin"],["Reykjavik","Iceland",64.1466,-21.9426,"Atlantic/Reykjavik"],
  ["Tromsø","Norway",69.6492,18.9553,"Europe/Oslo"],["Dubai","UAE",25.2048,55.2708,"Asia/Dubai"],
  ["Mumbai","India",19.076,72.8777,"Asia/Kolkata"],["Singapore","Singapore",1.3521,103.8198,"Asia/Singapore"],
  ["Tokyo","Japan",35.6762,139.6503,"Asia/Tokyo"],["Sydney","Australia",-33.8688,151.2093,"Australia/Sydney"],
  ["Auckland","New Zealand",-36.8485,174.7633,"Pacific/Auckland"],["São Paulo","Brazil",-23.5505,-46.6333,"America/Sao_Paulo"],
  ["Cape Town","South Africa",-33.9249,18.4241,"Africa/Johannesburg"]
].map(([name, region, lat, lon, tz]) => ({ name, region, lat, lon, tz }));

let loc = store.get("loc", null);
const hadSavedLoc = !!loc;
if (!loc) { const c = CITIES.find(c => c.tz === deviceTZ) || CITIES[0]; loc = { ...c, source: "default" }; }
let units = store.get("units", "F");
let skyMode = store.get("sky", "auto");
let live = null;          // {code, cover, temp, wind, time}
let liveState = "loading"; // loading | ok | failed

/* ---------- Sun math (after Astronomical Algorithms / SunCalc) ---------- */
const PI = Math.PI, rad = PI / 180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397;
const toDays = d => d.valueOf() / dayMs - 0.5 + J1970 - J2000;
const fromJulian = j => new Date((j + 0.5 - J1970) * dayMs);
const rightAscension = (l, b) => Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l));
const declination = (l, b) => Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l));
const solarMeanAnomaly = d => rad * (357.5291 + 0.98560028 * d);
const eclipticLongitude = M => {
  const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  return M + C + rad * 102.9372 + PI;
};
function sunPosition(date, lat, lng) {
  const lw = rad * -lng, phi = rad * lat, d = toDays(date);
  const M = solarMeanAnomaly(d), L = eclipticLongitude(M);
  const dec = declination(L, 0), ra = rightAscension(L, 0);
  const H = rad * (280.16 + 360.9856235 * d) - lw - ra;
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  const azS = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
  let az = (azS / rad + 180) % 360; if (az < 0) az += 360;
  // atmospheric refraction for display altitude
  let h = alt; if (h < 0) h = 0;
  const refr = 0.0002967 / Math.tan(h + 0.00312536 / (h + 0.08901179));
  return { alt: (alt + refr) / rad, az };
}
const J0 = 0.0009;
function sunTimes(date, lat, lng) {
  const lw = rad * -lng, phi = rad * lat, d = toDays(date);
  const n = Math.round(d - J0 - lw / (2 * PI));
  const ds = J0 + lw / (2 * PI) + n;
  const M = solarMeanAnomaly(ds), L = eclipticLongitude(M), dec = declination(L, 0);
  const transit = (a) => J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const Jnoon = transit(ds);
  const pair = (h) => {
    const w = Math.acos((Math.sin(h * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
    if (isNaN(w)) return [null, null];
    const Jset = transit(J0 + (w + lw) / (2 * PI) + n);
    return [fromJulian(Jnoon - (Jset - Jnoon)), fromJulian(Jset)];
  };
  const [rise, set] = pair(-0.833), [dawn, dusk] = pair(-6), [gEnd, gStart] = pair(6);
  return { noon: fromJulian(Jnoon), rise, set, dawn, dusk, gEnd, gStart };
}
function eventsAround(now, lat, lng) {
  const evs = [];
  for (let k = -1; k <= 1; k++) {
    const t = sunTimes(new Date(now.getTime() + k * dayMs), lat, lng);
    for (const type of ["noon", "rise", "set", "dawn", "dusk", "gEnd", "gStart"]) if (t[type]) evs.push({ type, t: t[type] });
  }
  evs.sort((a, b) => a.t - b.t);
  return evs.filter((ev, i) => !evs.slice(0, i).some(p => p.type === ev.type && Math.abs(p.t - ev.t) < 6e4));
}

/* ---------- Formatting ---------- */
const fmtCache = {};
function fmt(kind, d) {
  const key = kind + "|" + loc.tz;
  if (!fmtCache[key]) {
    const o = { timeZone: loc.tz };
    if (kind === "time") Object.assign(o, { hour: "numeric", minute: "2-digit" });
    if (kind === "date") Object.assign(o, { weekday: "short", month: "short", day: "numeric" });
    if (kind === "ymd") { fmtCache[key] = new Intl.DateTimeFormat("en-CA", { timeZone: loc.tz, year: "numeric", month: "2-digit", day: "2-digit" }); return fmtCache[key].format(d); }
    try { fmtCache[key] = new Intl.DateTimeFormat(undefined, o); } catch (err) { loc.tz = deviceTZ; return fmt(kind, d); }
  }
  return fmtCache[key].format(d);
}
const pad = n => String(n).padStart(2, "0");
function dur(ms, withSec) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return withSec ? { h, m: pad(m), s: pad(sec) } : `${h}h ${pad(m)}m`;
}
const DIRS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = az => DIRS[Math.round(az / 22.5) % 16];

/* ---------- Weather model ---------- */
const PRESETS = {
  clear:    { label: "Clear", cover: .03 },
  partly:   { label: "Partly cloudy", cover: .42 },
  overcast: { label: "Overcast", cover: .96 },
  rain:     { label: "Rain", cover: 1, precip: "rain", rate: .6 },
  storm:    { label: "Thunderstorm", cover: 1, precip: "rain", rate: 1, storm: true },
  snow:     { label: "Snow", cover: .95, precip: "snow", rate: .6 },
  fog:      { label: "Fog", cover: .7, fog: true }
};
function fromWMO(code, coverPct) {
  const c = coverPct == null ? null : coverPct / 100;
  const w = (label, extra, defCover) => ({ label, cover: c == null ? defCover : c, ...extra });
  if (code === 0) return w("Clear sky", {}, .03);
  if (code === 1) return w("Mostly clear", {}, .2);
  if (code === 2) return w("Partly cloudy", {}, .45);
  if (code === 3) return w("Overcast", {}, .96);
  if (code === 45 || code === 48) return w("Fog", { fog: true }, .7);
  if (code >= 51 && code <= 57) return w(code >= 56 ? "Freezing drizzle" : "Drizzle", { precip: "rain", rate: .25 }, .95);
  if (code === 61) return w("Light rain", { precip: "rain", rate: .38 }, 1);
  if (code === 63) return w("Rain", { precip: "rain", rate: .62 }, 1);
  if (code === 65) return w("Heavy rain", { precip: "rain", rate: 1 }, 1);
  if (code === 66 || code === 67) return w("Freezing rain", { precip: "rain", rate: .6 }, 1);
  if (code === 71) return w("Light snow", { precip: "snow", rate: .35 }, .95);
  if (code === 73 || code === 77) return w("Snow", { precip: "snow", rate: .6 }, .95);
  if (code === 75) return w("Heavy snow", { precip: "snow", rate: 1 }, 1);
  if (code === 80) return w("Light showers", { precip: "rain", rate: .4 }, .8);
  if (code === 81) return w("Rain showers", { precip: "rain", rate: .65 }, .85);
  if (code === 82) return w("Violent showers", { precip: "rain", rate: 1 }, 1);
  if (code === 85 || code === 86) return w("Snow showers", { precip: "snow", rate: .6 }, .9);
  if (code >= 95) return w(code === 95 ? "Thunderstorm" : "Thunderstorm, hail", { precip: "rain", rate: 1, storm: true }, 1);
  return w("Cloudy", {}, .7);
}
function currentWeather() {
  if (skyMode === "auto" && live) return fromWMO(live.code, live.cover);
  return PRESETS[skyMode] || PRESETS.clear;
}

async function fetchJSON(url, ms) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms || 8000);

}
async function loadWeather() {
  const at = { lat: loc.lat, lon: loc.lon };
  try {
    const j = await fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${at.lat}&longitude=${at.lon}&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`);
    if (at.lat !== loc.lat || at.lon !== loc.lon) return;
    const c = j.current;
    live = { code: c.weather_code, cover: c.cloud_cover, temp: c.temperature_2m, wind: c.wind_speed_10m, time: new Date() };
    liveState = "ok";

/* ---------- Readout ---------- */
let astro = null;
function computeAstro(now) {
  const pos = sunPosition(now, loc.lat, loc.lon);
  const evs = eventsAround(now, loc.lat, loc.lon);
  const next = type => evs.find(e => e.type === type && e.t > now);
  const prev = type => { for (let i = evs.length - 1; i >= 0; i--) if (evs[i].type === type && evs[i].t <= now) return evs[i]; };
  const today = fmt("ymd", now);
  const onToday = type => evs.find(e => e.type === type && fmt("ymd", e.t) === today);
  const path = [];
  for (let m = -12 * 60; m <= 12 * 60; m += 6) {
    const t = new Date(now.getTime() + m * 6e4); const p = sunPosition(t, loc.lat, loc.lon); path.push(p);
  }
  astro = { now, pos, next, prev, onToday, path, day: pos.alt > -0.833 };
}

function setFact(list) {
  $("facts").innerHTML = list.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join("");
}
function renderReadout() {
  const now = new Date(); computeAstro(now);
  const { pos, next, prev, onToday, day } = astro;
  $("clockTime").textContent = fmt("time", now);
  $("clockDate").textContent = fmt("date", now);
  $("app").classList.toggle("is-night", !day);

  const nSet = next("set"), nRise = next("rise"), pRise = prev("rise"), pSet = prev("set");
  let from, to, label, sub;
  if (day) {
    label = "Daylight left"; from = pRise && pRise.t; to = nSet && nSet.t;
    sub = to ? `Sunset at <b>${fmt("time", to)}</b>` : "";
    const g = next("gStart"); if (g && to && g.t < to) sub += ` · golden hour at <b>${fmt("time", g.t)}</b>`;
    else if (to && pos.alt < 6) sub += " · golden hour now";
  } else {
    label = "Until sunrise"; from = pSet && pSet.t; to = nRise && nRise.t;
    const dawn = next("dawn");
    sub = to ? `Sunrise at <b>${fmt("time", to)}</b>` : "";
    if (dawn && to && dawn.t < to) sub += ` · first light <b>${fmt("time", dawn.t)}</b>`;
  }
  $("cdLabel").textContent = label;
  if (to) {
    const d = dur(to - now, true);
    $("countdown").innerHTML = `${d.h}<span class="u">h</span>${d.m}<span class="u">m</span>${d.s}<span class="u">s</span>`;
    $("cdSub").innerHTML = sub;
  } else {
    $("countdown").textContent = "—";
    $("cdSub").textContent = day ? "The sun doesn't set here today (midnight sun)." : "The sun doesn't rise here today (polar night).";
  }
  if (from && to) {
    const f = Math.min(1, Math.max(0, (now - from) / (to - from)));
    $("trackFill").style.width = (f * 100).toFixed(1) + "%";
    $("trackStart").textContent = (day ? "Rose " : "Set ") + fmt("time", from);
    $("trackEnd").textContent = (day ? "Sets " : "Rises ") + fmt("time", to);
  } else { $("trackFill").style.width = day ? "100%" : "0%"; $("trackStart").textContent = ""; $("trackEnd").textContent = ""; }

  const r = onToday("rise"), s = onToday("set"), noon = onToday("noon"), dawn = onToday("dawn"), dusk = onToday("dusk"), gs = onToday("gStart");
  const dl = r && s ? dur(s.t - r.t) : (day ? "24h 00m" : "0h 00m");
  setFact([
    ["Sunrise", r ? fmt("time", r.t) : "—"], ["Sunset", s ? fmt("time", s.t) : "—"],
    ["First light", dawn ? fmt("time", dawn.t) : "—"], ["Last light", dusk ? fmt("time", dusk.t) : "—"],
    ["Solar noon", noon ? fmt("time", noon.t) : "—"], ["Day length", dl],
    ["Golden hour", gs ? fmt("time", gs.t) : "—"], ["Sun now", `${pos.alt.toFixed(1)}° · ${Math.round(pos.az)}° ${compass(pos.az)}`]
  ]);
  const altTxt = pos.alt >= 0 ? `${pos.alt.toFixed(1)}° above horizon` : `${Math.abs(pos.alt).toFixed(1)}° below horizon`;
  $("skyTag").textContent = `Sun ${altTxt} · ${compass(pos.az)}`;
  $("foot").textContent = `${loc.lat.toFixed(3)}°, ${loc.lon.toFixed(3)}° · times shown in ${loc.tz.replace(/_/g, " ")}`;
}

function renderWeather() {
  const w = currentWeather();
  $("wxCond").textContent = w.label;
  if (skyMode === "auto" && live) {
    const t = units === "F" ? live.temp : (live.temp - 32) * 5 / 9;
    $("wxTemp").textContent = `${Math.round(t)}°${units}`;
    $("wxNote").textContent = `Live · ${Math.round(live.cover)}% cloud cover · wind ${Math.round(units === "F" ? live.wind : live.wind * 1.609)} ${units === "F" ? "mph" : "km/h"} · updated ${fmt("time", live.time)}`;
  } else {
    $("wxTemp").textContent = "";
    $("wxNote").textContent = liveState === "loading" ? "Loading live weather…"
      : liveState === "failed" ? "Live weather couldn't load here. Pick the conditions to show on the sky."
      : "Showing a preview. Tap Live to go back to real conditions.";
  }
  const chips = [["auto", "Live"], ...Object.entries(PRESETS).map(([k, v]) => [k, v.label])];
  $("chips").innerHTML = chips.map(([k, l]) =>
    `<button class="chip" data-k="${k}" aria-pressed="${skyMode === k || (k === "auto" && skyMode === "auto" && !!live)}"${k === "auto" && liveState === "failed" && !live ? " disabled" : ""}>${l}</button>`).join("");

$("chips").addEventListener("click", ev => {
  const b = ev.target.closest(".chip"); if (!b || b.disabled) return;
  skyMode = b.dataset.k; store.set("sky", skyMode); applyWeather(); renderWeather();

/* ---------- Sky canvas ---------- */
const cv = $("sky"), ctx = cv.getContext("2d");

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rnd = (a, b) => a + Math.random() * (b - a);

function resize() {

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H * .66, r: rnd(.4, 1.4), tw: rnd(0, 6) }));
  applyWeather();
}
function applyWeather() {
  wx = currentWeather();

  clouds = Array.from({ length: n }, (_, i) => makeCloud(rnd(-.1, 1.1) * W));
  const nd = wx.precip === "rain" ? Math.round(40 + wx.rate * 220) : 0;
  drops = Array.from({ length: nd }, () => ({ x: Math.random() * W, y: Math.random() * H, l: rnd(8, 16), v: rnd(520, 760) }));
  const nf = wx.precip === "snow" ? Math.round(30 + wx.rate * 140) : 0;
  flakes = Array.from({ length: nf }, () => ({ x: Math.random() * W, y: Math.random() * H, r: rnd(1, 2.8), v: rnd(28, 60), ph: rnd(0, 6) }));
}

  return { x, y: rnd(.06, .48) * H, s, v: rnd(4, 11), puffs: Array.from({ length: 6 }, (_, i) => ({ dx: (i - 2.5) * 22 + rnd(-6, 6), dy: rnd(-10, 6) - (i > 1 && i < 4 ? 10 : 0), r: rnd(16, 28) })) };

const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

  [15, "#3c84d6", "#acd2f1"], [90, "#2266c4", "#9ec9ee"]

const clamp01 = v => Math.min(1, Math.max(0, v));

    ctx.beginPath(); ctx.arc(sx, sy, rr, 0, PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(255,236,190,.35)"; ctx.beginPath(); ctx.arc(sx, sy, rr - 4, 0, PI * 2); ctx.fill();
  }

  // ground
  const gTop = mix(mix(hex("#0a0e18"), hex("#2c3b33"), daylight), hor, .12);
  const gBot = mix(gTop, [0, 0, 0], .55);
  const gg = ctx.createLinearGradient(0, horizonY, 0, H);
  gg.addColorStop(0, css(gTop)); gg.addColorStop(1, css(gBot));
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.moveTo(0, horizonY);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, horizonY - 6 - 7 * Math.sin(x / W * 9 + 1.3) * Math.sin(x / W * 3.1));
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, horizonY + .5); ctx.lineTo(W, horizonY + .5); ctx.stroke();

  // path below horizon + ghost sun

  if (alt < -1) {
    ctx.strokeStyle = "rgba(255,214,150,.75)"; ctx.lineWidth = 2;

/* ---------- Location sheet ---------- */
function setLocation(next) {
  loc = { name: next.name, region: next.region || "", lat: +next.lat, lon: +next.lon, tz: next.tz || deviceTZ, source: next.source };
  store.set("loc", loc);
  for (const k in fmtCache) delete fmtCache[k];
  $("placeName").textContent = loc.name;
  live = null; liveState = "loading";
  renderReadout(); renderWeather(); applyWeather(); loadWeather();
}
const openSheet = () => { $("sheet").hidden = false; $("backdrop").hidden = false; $("gpsStatus").textContent = ""; $("citySearch").focus(); };
const closeSheet = () => { $("sheet").hidden = true; $("backdrop").hidden = true; $("placeBtn").focus(); };
$("placeBtn").addEventListener("click", openSheet);
$("sheetDone").addEventListener("click", closeSheet);
$("backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("sheet").hidden) closeSheet(); });
// Android back button: close the location sheet first; return false to let the app exit
window.sunpathBack = () => { if (!$("sheet").hidden) { closeSheet(); return true; } return false; };

function locateMe(fromButton) {
  if (!navigator.geolocation) { if (fromButton) $("gpsStatus").textContent = "This browser can't share your location. Search for a city instead."; return; }
  if (fromButton) $("gpsStatus").textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(p => {
    setLocation({ name: "My location", region: "", lat: +p.coords.latitude.toFixed(4), lon: +p.coords.longitude.toFixed(4), tz: deviceTZ, source: "gps" });
    if (fromButton) { $("gpsStatus").textContent = "Location set."; closeSheet(); }
  }, () => {
    if (fromButton) $("gpsStatus").textContent = "Location access isn't available here. Search for a city or enter coordinates.";
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 6e5 });
}
$("gpsBtn").addEventListener("click", () => locateMe(true));

let searchTimer = 0, searchSeq = 0;
function showResults(list) {
  $("cityResults").innerHTML = list.slice(0, 8).map((c, i) =>
    `<li><button data-i="${i}">${c.name} <small>${c.region || ""}</small></button></li>`).join("");
  showResults.list = list;
}

  clearTimeout(searchTimer);

  if (!q) { showResults([]); return; }
  const local = CITIES.filter(c => (c.name + " " + c.region).toLowerCase().includes(q.toLowerCase())).map(c => ({ ...c, source: "city" }));
  showResults(local);
  if (q.length < 2) return;
  const seq = ++searchSeq;
  searchTimer = setTimeout(async () => {
    try {
      const j = await fetchJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=en&format=json`, 5000);
      if (seq !== searchSeq) return;
      const remote = (j.results || []).map(r => ({ name: r.name, region: [r.admin1, r.country].filter(Boolean).join(", "), lat: r.latitude, lon: r.longitude, tz: r.timezone, source: "city" }));
      if (remote.length) showResults(remote);
    } catch (err) { /* offline or blocked: keep the built-in matches */ }
  }, 300);
});
$("cityResults").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const c = showResults.list[+b.dataset.i]; if (!c) return;
  setLocation(c); $("citySearch").value = ""; showResults([]); closeSheet();
});
$("coordBtn").addEventListener("click", () => {
  const lat = parseFloat($("latIn").value), lon = parseFloat($("lonIn").value);
  if (!(lat >= -90 && lat <= 90) || !(lon >= -180 && lon <= 180)) { $("coordStatus").textContent = "Latitude must be between -90 and 90, longitude between -180 and 180."; return; }
  $("coordStatus").textContent = "";
  setLocation({ name: `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`, lat, lon, tz: deviceTZ, source: "coords" }); closeSheet();
});
function setUnits(u) {
  units = u; store.set("units", u);
  $("unitF").setAttribute("aria-pressed", u === "F"); $("unitC").setAttribute("aria-pressed", u === "C");
  renderWeather();
}
$("unitF").addEventListener("click", () => setUnits("F"));
$("unitC").addEventListener("click", () => setUnits("C"));

/* ---------- Start ---------- */
$("placeName").textContent = loc.name;
setUnits(units);
renderReadout(); renderWeather();
resize();
if ("ResizeObserver" in window) new ResizeObserver(resize).observe(cv); else addEventListener("resize", resize);
requestAnimationFrame(loop);
setInterval(renderReadout, 1000);
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { renderReadout(); if (!live || Date.now() - live.time > 10 * 60 * 1000) loadWeather(); } });
if (!hadSavedLoc) locateMe(false);
})();
</script>
