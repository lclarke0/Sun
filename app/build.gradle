plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sunpath.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sunpath.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Fixed key so each new build installs as an update over the previous one
    signingConfigs {
        sunpath {
            storeFile file("sunpath.keystore")
            storePassword "sunpath"
            keyAlias "sunpath"
            keyPassword "sunpath"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sunpath
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sunpath
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
